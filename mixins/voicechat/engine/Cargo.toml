[package]
name = "voicechat-engine"
version = "1.0.3"
edition = "2024"
license = "MIT"
description = "An unofficial Simple Voice Chat protocol client for Horizon: protocol, Opus and audio"
publish = false

# Only crates in Horizon's Cargo.lock, by version requirement.
[dependencies]
cpal = "0.16"
ring = "0.17"

# The vendored libopus in opus/ is compiled by build.rs with this crate.
[build-dependencies]
cc = "1"
